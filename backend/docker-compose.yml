services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loosebricks
      POSTGRES_PASSWORD: loosebricks
      POSTGRES_DB: loosebricks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"

volumes:
  pgdata:
